name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  index:
    name: Index consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate the driver index
        run: python3 scripts/check_index.py

      - name: Resolve every indexed repository on GitHub
        if: github.event_name != 'push' || github.ref == 'refs/heads/master'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check_index.py --check-remote

      - name: Unit tests for the index checker
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

  markdown:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: markdownlint-cli2
        run: npx --yes markdownlint-cli2@0.14.0
